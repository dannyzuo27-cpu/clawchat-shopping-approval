<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11131a" />
    <title>购物审批 Liveware</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div><span class="mark">CC</span><strong>购物审批</strong><small>ClawChat Liveware</small></div>
        <span id="identity" class="identity">正在确认身份</span>
      </header>
      <main>
        <section class="hero">
          <p>DOUBLE ENTRY · ONE RECORD</p>
          <h1>想买什么，<br />先走个审批。</h1>
          <span>聊天框和 Liveware 都能提交，最终汇入同一张审批单。</span>
        </section>
        <section class="composer card">
          <div class="section-title"><span>新申请</span><button id="toggleForm">＋ 提交购物申请</button></div>
          <form id="requestForm" hidden>
            <label>商品名称<input name="title" required placeholder="例如：降噪耳机" /></label>
            <label>价格（可选）<input name="amount" inputmode="decimal" placeholder="例如：1999" /></label>
            <label class="wide">购买理由<textarea name="reason" required placeholder="为什么现在需要它？"></textarea></label>
            <label class="wide">家中同类物品（可选）<textarea name="inventory" placeholder="已有物品、使用频率、当前状况"></textarea></label>
            <label class="wide">图片链接（可选）<input name="imageUrl" type="url" placeholder="由支持识图的 Agent 或图床提供" /></label>
            <button class="primary" type="submit">提交给 Agent 初审</button>
          </form>
        </section>
        <section class="board card">
          <div class="section-title"><span>审批记录</span><button id="refresh">刷新</button></div>
          <div id="empty" class="empty" hidden>还没有申请。你可以在这里提交，也可以直接在 ClawChat 里告诉 Agent。</div>
          <div id="list" class="list"></div>
        </section>
      </main>
    </div>
    <dialog id="reviewDialog">
      <form method="dialog" id="reviewForm">
        <h2>共同审批</h2>
        <p id="reviewTitle"></p>
        <label>最终理由<textarea name="reason" required placeholder="留下批准或不批准的具体理由"></textarea></label>
        <div class="review-actions">
          <button value="cancel">取消</button>
          <button type="button" data-status="rejected" class="danger">不批准</button>
          <button type="button" data-status="conditional">附条件</button>
          <button type="button" data-status="approved" class="approve">批准</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
