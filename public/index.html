<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11131a" />
    <title>家庭消费 Liveware</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div><span class="mark">CC</span><strong>家庭消费</strong><small>ClawChat Liveware</small></div>
        <span id="identity" class="identity">正在确认身份</span>
      </header>
      <main>
        <section class="hero">
          <p>ONE HOME · ONE LEDGER</p>
          <h1>花了多少，<br />想买什么。</h1>
          <span>日常消费直接记账，额外购物先走审批。聊天框和 Liveware 共用同一份记录。</span>
        </section>
        <div class="workspace">
          <nav class="tabs" aria-label="功能切换">
            <button class="active" data-tab="approval">购物审批</button>
            <button data-tab="ledger">日常记账</button>
          </nav>
          <div id="approvalPanel" class="panel active">
            <section class="composer card">
              <div class="section-title"><span>新申请</span><button id="toggleForm">＋ 提交购物申请</button></div>
              <form id="requestForm" hidden>
                <label>商品名称<input name="title" required placeholder="例如：降噪耳机" /></label>
                <label>价格（可选）<input name="amount" inputmode="decimal" placeholder="例如：1999" /></label>
                <label class="wide">购买理由<textarea name="reason" required placeholder="为什么现在需要它？"></textarea></label>
                <label class="wide">家中同类物品（可选）<textarea name="inventory" placeholder="已有物品、使用频率、当前状况"></textarea></label>
                <label class="wide">图片链接（可选）<input name="imageUrl" type="url" placeholder="由支持识图的 Agent 或图床提供" /></label>
                <button class="primary" type="submit">提交给 Agent 初审</button>
              </form>
            </section>
            <section class="board card">
              <div class="section-title"><span>审批记录</span><button class="refresh">刷新</button></div>
              <div id="empty" class="empty" hidden>还没有申请。你可以在这里提交，也可以直接在 ClawChat 里告诉 Agent。</div>
              <div id="list" class="list"></div>
            </section>
          </div>
          <div id="ledgerPanel" class="panel">
            <section class="summary-grid" aria-label="本月账本摘要">
              <article class="summary card"><span>本月支出</span><strong id="monthExpense">¥0.00</strong></article>
              <article class="summary card"><span>本月收入</span><strong id="monthIncome">¥0.00</strong></article>
              <article class="summary card"><span>本月笔数</span><strong id="monthCount">0</strong></article>
            </section>
            <section class="composer card">
              <div class="section-title"><span>记一笔</span><button id="toggleLedgerForm">＋ 新增记账</button></div>
              <form id="ledgerForm" hidden>
                <label>类型<select name="kind"><option value="expense">支出</option><option value="income">收入</option></select></label>
                <label>金额<input name="amount" required inputmode="decimal" placeholder="例如：38" /></label>
                <label>分类<input name="category" required placeholder="例如：餐饮" /></label>
                <label>日期<input name="date" type="date" required /></label>
                <label class="wide">备注（可选）<input name="note" placeholder="例如：午饭" /></label>
                <button class="primary" type="submit">写入我的账本</button>
              </form>
            </section>
            <section class="board card">
              <div class="section-title"><span>我的账本</span><button class="refresh">刷新</button></div>
              <div id="ledgerEmpty" class="empty" hidden>还没有记录。在这里记一笔，或直接在 ClawChat 里对 Agent 说“今天午饭花了38”。</div>
              <div id="ledgerList" class="ledger-list"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <dialog id="reviewDialog">
      <form method="dialog" id="reviewForm">
        <h2>共同审批</h2>
        <p id="reviewTitle"></p>
        <label>最终理由<textarea name="reason" required placeholder="留下批准或不批准的具体理由"></textarea></label>
        <div class="review-actions">
          <button value="cancel">取消</button>
          <button type="button" data-status="rejected" class="danger">不批准</button>
          <button type="button" data-status="conditional">附条件</button>
          <button type="button" data-status="approved" class="approve">批准</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
