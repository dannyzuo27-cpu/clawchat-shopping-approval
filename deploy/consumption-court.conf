[program:consumption-court]
directory=/opt/data/workspace/clawchat-consumption-court
command=/usr/local/bin/node server.mjs
user=hermes
environment=NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/opt/data/workspace/clawchat-consumption-court/server.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
